# Runs on every push: catches TypeScript errors before they break everyone's previews/renders.
name: Type check
on:
  push:
    branches: [main]
jobs:
  tsc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit -p .
